<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | RecipeHub</title>
    <link rel="icon" type="image/png" href="image/logo.png" >
       <style>
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

/* ================= Body ================= */
body {
  font-family: "Inter", system-ui, -apple-system, sans-serif;
  min-height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 60px 20px;

  /* modern soft gradient bg */
  background: linear-gradient(135deg, #ff7eb3, #ff758c, #ff5e62);
}

/* ================= Container ================= */
.contact-container {
  width: 100%;
  max-width: 1100px;

  display: grid;
  grid-template-columns: 1fr 1.2fr;
  gap: 32px;
}

/* ================= Glass Cards ================= */
.contact-info,
.contact-form {
  background: rgba(255, 255, 255, 0.9);

  border-radius: 22px;
  padding: 40px;

  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);

  box-shadow:
    0 15px 40px rgba(0, 0, 0, 0.12);

  transition: 0.3s ease;
}

.contact-info:hover,
.contact-form:hover {
  transform: translateY(-5px);
}

/* ================= Headings ================= */
.contact-info h2,
.contact-form h2 {
  font-size: 1.6rem;
  font-weight: 700;
  margin-bottom: 20px;

  background: linear-gradient(135deg, #ff5e62, #ff9966);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* ================= Text ================= */
.contact-info p {
  font-size: 0.95rem;
  line-height: 1.7;
  color: #4b5563;
}

/* ================= Social Icons ================= */
.social-links {
  margin-top: 18px;
}

.social-links a {
  font-size: 1.4rem;
  margin-right: 16px;
  color: #555;
  transition: 0.25s;
}

.social-links a:hover {
  color: #ff5e62;
  transform: scale(1.2);
}

/* ================= Form ================= */
.contact-form form {
  display: flex;
  flex-direction: column;
}

/* inputs */
.contact-form input,
.contact-form textarea {
  padding: 12px 14px;
  margin-bottom: 16px;

  border-radius: 12px;
  border: 1px solid #e5e7eb;

  font-size: 0.95rem;

  transition: 0.25s;
}

.contact-form input:focus,
.contact-form textarea:focus {
  outline: none;
  border-color: #ff5e62;
  box-shadow: 0 0 0 3px rgba(255, 94, 98, 0.25);
  transform: translateY(-2px);
}

.contact-form textarea {
  min-height: 130px;
  resize: vertical;
}

/* ================= Button ================= */
.contact-form button {
  margin-top: 10px;

  padding: 12px;

  border-radius: 999px;
  border: none;

  font-weight: 600;
  font-size: 0.95rem;
  color: white;

  cursor: pointer;

  background: linear-gradient(135deg, #ff5e62, #ff9966);
  transition: 0.25s;
}

.contact-form button:hover {
  transform: translateY(-2px) scale(1.03);
  box-shadow: 0 10px 25px rgba(255, 94, 98, 0.35);
}

/* ================= Responsive ================= */
@media (max-width: 768px) {
  .contact-container {
    grid-template-columns: 1fr;
  }

  .contact-info,
  .contact-form {
    padding: 28px;
  }
}
</style>
</head>
<body>
    <div class="contact-container">
        <div class="contact-info">
            <h2>Contact Us</h2>
            <p>If you have any questions or comments, feel free to reach out to us. We’d love to hear from you!</p>
            <p><strong>Email:</strong> recipehub2427@gmail.com</p>
            <p><strong>Phone:</strong> +(91) 9042443040</p>
            <p><strong>Address:</strong> 61 Santhai Road, Thoothukudi, Pin 628002</p>
            <div class="social-links">
                <a href="https://facebook.com" target="_blank" title="Follow us on Facebook">Facebook</a>
                <a href="https://x.com/HarishSrin33923?t=HFCIPlxHYVZ0mWjyDmN0sg&s=09" target="_blank" title="Follow us on Twitter">Twitter</a>
                <a href="https://www.instagram.com/recipehub10?igsh=YmR1djBiNjZzMjZ4" target="_blank" title="Follow us on Instagram">Instagram</a>
            </div>
        </div>
        <div class="contact-form">
            <h2>Send Us a Message</h2>
            <form id="contactForm">
                <input type="text" name="name" placeholder="Your Name" required>
                <input type="email" name="email" placeholder="Your Email" required>
                <input type="tel" name="phone" placeholder="Your Phone Number">
                <textarea name="message" placeholder="Your Message" required></textarea>
                <button type="submit">Send Message</button>
            </form>
        </div>
    </div>
</body>
</html>

    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const contactForm = document.getElementById('contactForm');

            contactForm.addEventListener('submit', async (event) => {
                event.preventDefault();

                const formData = new FormData(contactForm);
                const data = Object.fromEntries(formData.entries());

                try {
                    const response = await fetch('https://dharunrecipehub-server.vercel.app/submit', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(data),
                    });

                    if (response.ok) {
                        alert('Message sent successfully!');
                        contactForm.reset();
                    } else {
                        alert('Error sending message!');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('Error sending message!');
                }
            });
        });
    </script>
</body>
</html>
